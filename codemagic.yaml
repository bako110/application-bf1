workflows:
  ios-testflight:
    name: iOS TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: codemagic

    environment:
      groups:
        - Secret

      node: 20
      xcode: latest
      cocoapods: default

      vars:
        BUNDLE_ID: com.bf1app
        XCODE_WORKSPACE: Bf1App.xcworkspace
        XCODE_SCHEME: Bf1App

      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.bf1app

    scripts:
      - name: Install JS dependencies
        script: |
          npm ci

      - name: Verify GoogleService-Info.plist
        script: |
          if [ ! -f "ios/Bf1App/GoogleService-Info.plist" ]; then
            echo "ERROR: GoogleService-Info.plist not found!"
            exit 1
          fi
          plutil -lint ios/Bf1App/GoogleService-Info.plist

      - name: Install CocoaPods
        script: |
          cd ios
          pod install

      - name: Set up code signing
        script: |
          xcode-project use-profiles

      - name: Build IPA
        script: |
          xcode-project build-ipa \
            --workspace "ios/$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME" || {
            echo "=========== ERREURS XCODE ==========="
            grep -h -B3 -A10 "error:" /tmp/xcodebuild_logs/*.log | head -120
            exit 1
          }

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
  ios-simulator:
    name: iOS Simulator (Appetize)
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      groups:
        - Secret

      node: 20
      xcode: latest
      cocoapods: default

      vars:
        XCODE_WORKSPACE: Bf1App.xcworkspace
        XCODE_SCHEME: Bf1App

    scripts:
      - name: Install JS dependencies
        script: |
          npm ci

      - name: Verify GoogleService-Info.plist
        script: |
          if [ ! -f "ios/Bf1App/GoogleService-Info.plist" ]; then
            echo "ERROR: GoogleService-Info.plist not found!"
            exit 1
          fi

      - name: Install CocoaPods
        script: |
          cd ios
          pod install

      - name: Build pour simulateur
        script: |
          xcodebuild \
            -workspace "ios/$XCODE_WORKSPACE" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath ios/build \
            CODE_SIGNING_ALLOWED=NO

      - name: Compresser en .zip
        script: |
          cd ios/build/Build/Products/Release-iphonesimulator
          zip -r "$CM_BUILD_DIR/bf1-simulator.zip" Bf1App.app

    artifacts:
      - bf1-simulator.zip
